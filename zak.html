<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KvízApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg:     #0f0f1e;
      --card:   #1a1a35;
      --card2:  #252550;
      --accent: #ff2d6b;
      --text:   #f0f0ff;
      --muted:  #7a85a3;
      --green:  #00e676;
      --red:    #ff1744;
      --blue:   #448aff;
      --yellow: #ffd600;
      --purple: #7c4dff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
           background-image: radial-gradient(ellipse at 20% 20%, #1e0a3c 0%, transparent 50%),
                             radial-gradient(ellipse at 80% 80%, #0a1e3c 0%, transparent 50%); }

    /* ── View container ── */
    .view {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      padding: 1.5rem 1.25rem; overflow-y: auto;
    }
    .hidden { display: none !important; }

    /* ── JOIN ── */
    .join-top { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .join-logo { text-align: center; margin-bottom: 2.5rem; }
    .logo-text  { font-size: 2.4rem; font-weight: 900;
                  background: linear-gradient(135deg, var(--accent), var(--purple));
                  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-text span { -webkit-text-fill-color: var(--text); color: var(--text); }
    .subtitle   { color: var(--muted); margin-top: .25rem; }

    label {
      display: block; font-size: .82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: .4rem;
    }
    input[type="text"] {
      width: 100%; background: var(--card); border: 2px solid #2a2a4a;
      border-radius: 12px; padding: .9rem 1rem; color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 700;
      outline: none; text-align: center; letter-spacing: .08em;
      margin-bottom: 1rem; transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    .error-msg { color: var(--red); font-size: .9rem; text-align: center; margin-bottom: .75rem; min-height: 1.2em; }

    .btn {
      width: 100%; padding: 1rem; border-radius: 12px; border: none;
      cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; box-shadow: 0 4px 20px rgba(255,45,107,.35); }
    .btn-success { background: linear-gradient(135deg, #00e676, #00b0ff); color: #0a1a0a; box-shadow: 0 4px 20px rgba(0,230,118,.3); }

    /* ── LOBBY ── */
    .lobby-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .avatar      { font-size: 5rem; margin-bottom: 1rem; }
    .lobby-name  { font-size: 1.6rem; font-weight: 900; margin-bottom: .5rem; }
    .pulse-wrap  { color: var(--muted); font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: .5rem; }
    .pulse {
      width: 10px; height: 10px; background: var(--green); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
    .quiz-badge {
      background: var(--card2); border-radius: 10px;
      padding: .65rem 1.25rem; margin-top: 1.5rem;
      font-weight: 700; font-size: .95rem;
    }

    /* ── QUESTION ── */
    .q-header {
      background: var(--card2); border-radius: 14px;
      padding: 1.1rem 1rem; margin-bottom: .9rem; text-align: center;
    }
    .q-meta   { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    .q-text   { font-size: 1.15rem; font-weight: 800; line-height: 1.3; margin-top: .35rem; }
    .q-timer  { font-size: 1.5rem; font-weight: 900; color: var(--accent); margin-top: .4rem; }

    .choices  { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .choice-btn {
      border: none; border-radius: 14px; padding: 1rem .65rem;
      cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 800; color: white;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 88px; text-align: center;
      line-height: 1.25; transition: transform .1s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice-btn:active { transform: scale(.94); }
    .choice-btn.answered { opacity: .45; pointer-events: none; }
    .choice-btn.selected { outline: 4px solid white; opacity: 1; }
    .cbA { background: linear-gradient(135deg,#ff1744,#c51162); }
    .cbB { background: linear-gradient(135deg,#448aff,#304ffe); }
    .cbC { background: linear-gradient(135deg,#ff9100,#e65100); }
    .cbD { background: linear-gradient(135deg,#00e676,#00796b); }
    .cb-icon { font-size: 1.4rem; margin-bottom: .2rem; }
    .cb-text { font-size: .88rem; }

    /* ── RESULT ── */
    .result-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .result-icon   { font-size: 5.5rem; margin-bottom: 1rem; }
    .result-label  { font-size: 1.7rem; font-weight: 900; margin-bottom: .5rem; }
    .result-pts    { font-size: 2.8rem; font-weight: 900; }
    .result-pts.ok { color: var(--green); }
    .result-pts.no { color: var(--red); }
    .result-sub    { color: var(--muted); margin-top: .3rem; }
    .result-total  { margin-top: 1.2rem; font-size: .95rem; color: var(--muted); }

    /* ── LEADERBOARD ── */
    .lb-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 1rem; text-align: center; }
    .lb-list  { display: flex; flex-direction: column; gap: .5rem; }
    .lb-item  {
      background: var(--card); border-radius: 10px; padding: .8rem 1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .lb-item.me { background: var(--card2); border: 2px solid var(--accent); }
    .lb-rank  { font-size: 1.2rem; font-weight: 900; width: 30px; text-align: center; }
    .lb-name  { flex: 1; font-weight: 700; }
    .lb-score { font-weight: 900; color: var(--accent); }
    .lb-wait  { text-align: center; color: var(--muted); padding: 2rem; }

    /* ── FINISHED ── */
    .fin-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .fin-icon  { font-size: 5rem; margin-bottom: 1rem; }
    .fin-title { font-size: 1.8rem; font-weight: 900; margin-bottom: .75rem; }
    .fin-score { font-size: 3.2rem; font-weight: 900; color: var(--accent); }
    .fin-sub   { color: var(--muted); margin-top: .4rem; }
    .fin-rank  { margin-top: 1rem; font-size: .95rem; color: var(--muted); }

    /* ── Avatar picker ── */
    .avatar-section { margin: .5rem 0 .75rem; }
    .avatar-picker  { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-top: .4rem; }
    .avatar-btn     { font-size: 1.6rem; background: var(--card2); border: 2px solid transparent;
                      border-radius: 10px; padding: .3rem .45rem; cursor: pointer;
                      transition: transform .12s, border-color .12s; line-height:1; }
    .avatar-btn.sel { border-color: var(--accent); transform: scale(1.25); }

    /* ── Feedback ── */
    .feedback-wrap  { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 1rem 0; }
    .feedback-title { font-size: 1.7rem; font-weight: 900; text-align: center; }
    .feedback-block { text-align: center; }
    .feedback-q     { font-size: 1rem; font-weight: 700; margin-bottom: .5rem; }
    .star-row       { display: flex; gap: .3rem; justify-content: center; }
    .star-btn       { font-size: 2rem; background: none; border: none; cursor: pointer; line-height:1;
                      opacity: .3; transition: opacity .1s, transform .1s; -webkit-tap-highlight-color:transparent; }
    .star-btn.on    { opacity: 1; transform: scale(1.1); }
    .feedback-hint  { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
    .skip-btn       { background: none; border: none; color: var(--muted); font-family: 'Nunito', sans-serif;
                      cursor: pointer; font-size: .9rem; -webkit-tap-highlight-color:transparent; }

    /* ── LB avatar ── */
    .lb-avatar { font-size: 1.3rem; }

    /* ── Question image ── */
    .q-image { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin-bottom: .75rem; display: none; }
    .q-image.visible { display: block; }

    /* ── Multi-select ── */
    .q-multi-hint { font-size: .8rem; color: var(--muted); text-align: center; margin-bottom: .5rem; }
    .confirm-wrap { margin-top: .75rem; }

    /* ── Text / Numeric answer ── */
    .text-answer-wrap { grid-column: 1/-1; }
    .text-answer-wrap input[type="text"], .text-answer-wrap input[type="number"] {
      width: 100%; background: var(--card); border: 2px solid var(--card2);
      border-radius: 12px; padding: .9rem 1rem; color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 700;
      outline: none; text-align: center; margin-bottom: .75rem; transition: border-color .15s;
    }
    .text-answer-wrap input:focus { border-color: var(--accent); }

    /* ── Ordering ── */
    .ordering-wrap { grid-column: 1/-1; }
    .ordering-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    .order-item {
      background: var(--card2); border-radius: 10px; padding: .85rem 1rem;
      display: flex; align-items: center; gap: .75rem;
      cursor: grab; user-select: none; font-weight: 700; touch-action: none;
      transition: opacity .15s;
    }
    .order-item.dragging  { opacity: .35; cursor: grabbing; }
    .order-item.drag-over { outline: 2px solid var(--accent); }
    .drag-handle { font-size: 1.2rem; color: var(--muted); flex-shrink: 0; }
    .order-num   {
      width: 26px; height: 26px; background: var(--bg); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 900; flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ═══ JOIN ═══ -->
<div id="view-join" class="view">
  <div class="join-top">
    <div class="join-logo">
      <div class="logo-text">Kvíz<span>App</span></div>
      <div class="subtitle">Připoj se ke kvízu</div>
    </div>
    <label>Kód kvízu (PIN)</label>
    <input type="text" id="pin-input" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="off">
    <label>Přezdívka</label>
    <input type="text" id="nick-input" placeholder="Tvoje jméno" maxlength="20" autocomplete="off"
           onkeydown="if(event.key==='Enter') joinSession()">
    <div class="avatar-section">
      <label>Vyber avatar</label>
      <div class="avatar-picker" id="avatar-picker">
        <button class="avatar-btn sel" onclick="pickAvatar(this,'🎮')">🎮</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🦁')">🦁</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐯')">🐯</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐺')">🐺</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🦊')">🦊</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐸')">🐸</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐙')">🐙</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🦄')">🦄</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐉')">🐉</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🤖')">🤖</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'👾')">👾</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🧙')">🧙</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🦸')">🦸</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🐼')">🐼</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🦋')">🦋</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🔥')">🔥</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'⚡')">⚡</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'💎')">💎</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'🌙')">🌙</button>
        <button class="avatar-btn" onclick="pickAvatar(this,'⭐')">⭐</button>
      </div>
    </div>
    <div id="join-error" class="error-msg"></div>
  </div>
  <button class="btn btn-primary" onclick="joinSession()">Připojit se →</button>
</div>

<!-- ═══ LOBBY ═══ -->
<div id="view-lobby" class="view hidden">
  <div class="lobby-center">
    <div class="avatar" id="lobby-avatar">🎮</div>
    <div class="lobby-name" id="lobby-name"></div>
    <div class="pulse-wrap"><div class="pulse"></div><span>Čekám na učitele…</span></div>
    <div class="quiz-badge" id="lobby-quiz"></div>
  </div>
</div>

<!-- ═══ QUESTION ═══ -->
<div id="view-question" class="view hidden">
  <div class="q-header">
    <div class="q-meta" id="q-meta"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-timer" id="q-timer"></div>
  </div>
  <img id="q-image" class="q-image" src="" alt="">
  <div id="q-multi-hint" class="q-multi-hint hidden">Vyber všechny správné odpovědi, pak potvrď.</div>
  <div class="choices" id="choices"></div>
  <div id="confirm-wrap" class="confirm-wrap hidden">
    <button class="btn btn-success" onclick="confirmMultiAnswer()">Potvrdit výběr →</button>
  </div>
</div>

<!-- ═══ RESULT ═══ -->
<div id="view-result" class="view hidden">
  <div class="result-center">
    <div class="result-icon" id="res-icon"></div>
    <div class="result-label" id="res-label"></div>
    <div class="result-pts" id="res-pts"></div>
    <div class="result-sub" id="res-sub"></div>
    <div class="result-total" id="res-total"></div>
  </div>
</div>

<!-- ═══ LEADERBOARD ═══ -->
<div id="view-leaderboard" class="view hidden">
  <div class="lb-title">🏆 Žebříček</div>
  <div class="lb-list" id="lb-list"><div class="lb-wait">Načítám…</div></div>
</div>

<!-- ═══ FEEDBACK ═══ -->
<div id="view-feedback" class="view hidden">
  <div class="feedback-wrap">
    <div class="feedback-title">Hotovo! 🎉</div>
    <div class="feedback-block">
      <div class="feedback-q">Jak těžký byl kvíz?</div>
      <div class="star-row" id="diff-stars">
        <button class="star-btn" onclick="setDiff(1)">★</button>
        <button class="star-btn" onclick="setDiff(2)">★</button>
        <button class="star-btn" onclick="setDiff(3)">★</button>
        <button class="star-btn" onclick="setDiff(4)">★</button>
        <button class="star-btn" onclick="setDiff(5)">★</button>
      </div>
      <div class="feedback-hint">1 = super easy · 5 = hodně těžký</div>
    </div>
    <div class="feedback-block">
      <div class="feedback-q">Jak se ti dařilo?</div>
      <div class="star-row" id="self-stars">
        <button class="star-btn" onclick="setSelf(1)">★</button>
        <button class="star-btn" onclick="setSelf(2)">★</button>
        <button class="star-btn" onclick="setSelf(3)">★</button>
        <button class="star-btn" onclick="setSelf(4)">★</button>
        <button class="star-btn" onclick="setSelf(5)">★</button>
      </div>
      <div class="feedback-hint">1 = špatně · 5 = výborně</div>
    </div>
    <button class="btn btn-primary" onclick="submitFeedback()" style="max-width:280px;width:100%">Odeslat →</button>
    <button class="skip-btn" onclick="showActualFinished()">Přeskočit</button>
  </div>
</div>

<!-- ═══ FINISHED ═══ -->
<div id="view-finished" class="view hidden">
  <div class="fin-center">
    <div class="fin-icon">🎉</div>
    <div class="fin-title">Kvíz skončil!</div>
    <div class="fin-score" id="fin-score"></div>
    <div class="fin-sub">bodů celkem</div>
    <div class="fin-rank" id="fin-rank"></div>
  </div>
</div>

<script>
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Stav
let player          = null
let session         = null
let questions       = null
let curQuestion     = null
let qStartedAt      = null
let answered        = false
let timerInt        = null
let sessionSub      = null
let selectedChoices = new Set()
let selectedAvatar  = '🎮'
let feedbackDiff    = 0
let feedbackSelf    = 0

// ═══════════════════════════════════════════════
//  AVATAR
// ═══════════════════════════════════════════════
function pickAvatar(btn, emoji) {
  document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('sel'))
  btn.classList.add('sel')
  selectedAvatar = emoji
}

// ═══════════════════════════════════════════════
//  ZVUKY (Web Audio API)
// ═══════════════════════════════════════════════
let _ac = null
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)()
  return _ac
}
function playSound(type) {
  try {
    const ac = getAC()
    const g  = ac.createGain(); g.connect(ac.destination)
    const o  = ac.createOscillator(); o.connect(g)
    const t  = ac.currentTime
    if (type === 'correct') {
      o.type = 'sine'
      o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t+.1); o.frequency.setValueAtTime(784, t+.2)
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t+.55)
      o.start(t); o.stop(t+.55)
    } else if (type === 'wrong') {
      o.type = 'sawtooth'
      o.frequency.setValueAtTime(220, t); o.frequency.setValueAtTime(160, t+.18)
      g.gain.setValueAtTime(.09, t); g.gain.exponentialRampToValueAtTime(.001, t+.35)
      o.start(t); o.stop(t+.35)
    } else if (type === 'tick') {
      o.type = 'sine'; o.frequency.value = 900
      g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.001, t+.06)
      o.start(t); o.stop(t+.06)
    } else if (type === 'finish') {
      o.type = 'sine'
      o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t+.1)
      o.frequency.setValueAtTime(784, t+.2); o.frequency.setValueAtTime(1047, t+.35)
      g.gain.setValueAtTime(.13, t); g.gain.exponentialRampToValueAtTime(.001, t+.7)
      o.start(t); o.stop(t+.7)
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════════
//  ZPĚTNÁ VAZBA
// ═══════════════════════════════════════════════
function setDiff(n) {
  feedbackDiff = n
  document.querySelectorAll('#diff-stars .star-btn').forEach((b,i) => b.classList.toggle('on', i < n))
}
function setSelf(n) {
  feedbackSelf = n
  document.querySelectorAll('#self-stars .star-btn').forEach((b,i) => b.classList.toggle('on', i < n))
}
async function submitFeedback() {
  if (feedbackDiff > 0 || feedbackSelf > 0) {
    await sb.from('feedback').insert({
      session_id:  session.id,
      player_id:   player.id,
      difficulty:  feedbackDiff || null,
      self_rating: feedbackSelf || null
    })
  }
  showActualFinished()
}
async function showActualFinished() {
  const { data: players } = await sb.from('players')
    .select('id, score').eq('session_id', session.id)
    .order('score', { ascending: false })
  const rank = (players||[]).findIndex(p => p.id === player.id) + 1
  document.getElementById('fin-score').textContent = player.score.toLocaleString('cs-CZ')
  document.getElementById('fin-rank').textContent  = `${rank}. místo z ${players?.length || 0} hráčů`
  showView('finished')
}

// ═══════════════════════════════════════════════
//  INIT – obnov session nebo předvyplň PIN
// ═══════════════════════════════════════════════
;(async function init() {
  const saved = sessionStorage.getItem('kv_player')
  if (saved) {
    try {
      await rejoinSession(JSON.parse(saved))
      return
    } catch(e) {
      sessionStorage.removeItem('kv_player')
    }
  }
  const pin = new URLSearchParams(window.location.search).get('pin')
  if (pin) {
    document.getElementById('pin-input').value = pin
    setTimeout(() => document.getElementById('nick-input').focus(), 100)
  }
})()

function showView(n) {
  document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'))
  document.getElementById('view-' + n).classList.remove('hidden')
}

// ═══════════════════════════════════════════════
//  PŘIPOJENÍ
// ═══════════════════════════════════════════════
async function joinSession() {
  const pin  = document.getElementById('pin-input').value.trim()
  const nick = document.getElementById('nick-input').value.trim()
  const err  = document.getElementById('join-error')
  err.textContent = ''

  if (!pin || pin.length !== 6)  { err.textContent = 'Zadej 6místný PIN.';       return }
  if (!nick)                      { err.textContent = 'Zadej přezdívku.';          return }
  if (nick.length < 2)            { err.textContent = 'Přezdívka je příliš krátká.'; return }

  // Najdi relaci (waiting = čeká, active = právě probíhá – pozdní připojení)
  const { data: sess, error } = await sb.from('sessions')
    .select('*').eq('pin', pin).in('status', ['waiting', 'active']).single()
  if (error || !sess) { err.textContent = 'Kvíz nenalezen nebo již skončil.'; return }

  // Přidej hráče
  const { data: p, error: pErr } = await sb.from('players')
    .insert({ session_id: sess.id, nickname: nick, score: 0, avatar: selectedAvatar }).select().single()
  if (pErr) { err.textContent = 'Chyba připojení – zkus to znovu.'; return }

  player    = p
  session   = sess
  questions = null

  // Ulož stav pro případ refreshe
  sessionStorage.setItem('kv_player', JSON.stringify({ playerId: p.id, sessionId: sess.id }))

  document.getElementById('lobby-name').textContent = nick
  document.getElementById('lobby-avatar').textContent = selectedAvatar
  document.getElementById('lobby-quiz').textContent = sess.quiz_title || 'Kvíz'

  subscribeToSession(sess.id)
  if (sess.status === 'waiting') {
    showView('lobby')
  } else {
    // Pozdní připojení – rovnou na aktuální otázku
    await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
  }
}

// ═══════════════════════════════════════════════
//  REALTIME – sleduj změny relace
// ═══════════════════════════════════════════════
function subscribeToSession(sessionId) {
  if (sessionSub) sessionSub.unsubscribe()
  sessionSub = sb.channel('sess-watch-' + sessionId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'sessions',
      filter: `id=eq.${sessionId}`
    }, payload => handleSessionUpdate(payload.new))
    .subscribe(async status => {
      // Při navázání subscription ověř aktuální stav – mohli jsme propásnout UPDATE
      if (status === 'SUBSCRIBED') {
        const { data: s } = await sb.from('sessions').select('*').eq('id', sessionId).single()
        if (s && s.status !== 'waiting') handleSessionUpdate(s)
      }
    })
}

async function handleSessionUpdate(sess) {
  session = sess
  if (sess.status === 'active' && sess.current_question_index >= 0) {
    await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
  }
  if (sess.status === 'leaderboard') await showLeaderboard()
  if (sess.status === 'finished')    showFinished()
}

// ═══════════════════════════════════════════════
//  OTÁZKA
// ═══════════════════════════════════════════════
async function loadQuestion(quizId, idx, startedAt) {
  answered        = false
  qStartedAt      = new Date(startedAt)
  selectedChoices = new Set()

  if (!questions) {
    const { data: qs } = await sb.from('questions')
      .select('*, choices(*)').eq('quiz_id', quizId).order('order_index')
    questions = qs
  }
  curQuestion = questions[idx]
  if (!curQuestion) return

  const qType  = curQuestion.type || 'multiple_choice'
  const sorted = (curQuestion.choices || []).slice().sort((a,b) => a.order_index - b.order_index)

  document.getElementById('q-meta').textContent = `Otázka ${idx+1} / ${session.total_questions}`
  document.getElementById('q-text').textContent = curQuestion.text
  document.getElementById('q-multi-hint').classList.add('hidden')
  document.getElementById('confirm-wrap').classList.add('hidden')

  const imgEl = document.getElementById('q-image')
  if (curQuestion.image_url) { imgEl.src = curQuestion.image_url; imgEl.classList.add('visible') }
  else                        { imgEl.src = '';                    imgEl.classList.remove('visible') }

  const choicesEl = document.getElementById('choices')

  if (qType === 'multiple_choice' || qType === 'true_false') {
    const icons = qType === 'true_false' ? ['✓','✗'] : ['▲','◆','●','■']
    const cls   = qType === 'true_false' ? ['cbA','cbB'] : ['cbA','cbB','cbC','cbD']
    choicesEl.innerHTML = sorted.map((c, i) => `
      <button class="choice-btn ${cls[i]}" id="cb-${c.id}" onclick="handleChoiceClick('${c.id}')">
        <div class="cb-icon">${icons[i]}</div>
        <div class="cb-text">${esc(c.text)}</div>
      </button>`).join('')

    if (qType === 'multiple_choice' && sorted.filter(c => c.is_correct).length > 1) {
      document.getElementById('q-multi-hint').classList.remove('hidden')
    }

  } else if (qType === 'text') {
    choicesEl.innerHTML = `
      <div class="text-answer-wrap">
        <input type="text" id="text-ans" placeholder="Napiš odpověď…"
               onkeydown="if(event.key==='Enter') submitTextAnswer()">
        <button class="btn btn-success" onclick="submitTextAnswer()">Odeslat →</button>
      </div>`
    setTimeout(() => document.getElementById('text-ans')?.focus(), 120)

  } else if (qType === 'numeric') {
    choicesEl.innerHTML = `
      <div class="text-answer-wrap">
        <input type="number" id="num-ans" step="any" placeholder="Zadej číslo…"
               onkeydown="if(event.key==='Enter') submitNumericAnswer()">
        <button class="btn btn-success" onclick="submitNumericAnswer()">Odeslat →</button>
      </div>`
    setTimeout(() => document.getElementById('num-ans')?.focus(), 120)

  } else if (qType === 'ordering') {
    const shuffled = [...sorted].sort(() => Math.random() - 0.5)
    choicesEl.innerHTML = `
      <div class="ordering-wrap">
        <div id="ordering-list" class="ordering-list">
          ${shuffled.map((c, i) => `
            <div class="order-item" data-id="${c.id}" draggable="true"
                 ondragstart="odStart(event)" ondragover="odOver(event)"
                 ondragleave="odLeave(event)" ondrop="odDrop(event)" ondragend="odEnd(event)"
                 ontouchstart="otStart(event)" ontouchmove="otMove(event)" ontouchend="otEnd(event)">
              <span class="drag-handle">≡</span>
              <span class="order-num">${i + 1}</span>
              <span style="flex:1">${esc(c.text)}</span>
            </div>`).join('')}
        </div>
        <button class="btn btn-success" onclick="submitOrdering()">Potvrdit pořadí →</button>
      </div>`
  }

  showView('question')
  startCountdown(curQuestion.time_limit, startedAt)
}

function startCountdown(limit, startedAt) {
  clearInterval(timerInt)
  const start = new Date(startedAt)
  const el    = document.getElementById('q-timer')

  function tick() {
    const elapsed   = (Date.now() - start) / 1000
    const remaining = Math.max(0, limit - elapsed)
    el.textContent  = Math.ceil(remaining) + 's'
    el.style.color  = remaining < 5 ? 'var(--red)' : remaining < 10 ? 'var(--yellow)' : 'var(--accent)'
    if (remaining <= 5 && remaining > 0 && Math.ceil(remaining) !== Math.ceil(remaining + 0.5)) playSound('tick')
    if (remaining <= 0) {
      clearInterval(timerInt)
      if (!answered) showResult(false, null, 0)
    }
  }
  tick()
  timerInt = setInterval(tick, 500)
}

// ═══════════════════════════════════════════════
//  ODPOVĚĎ
// ═══════════════════════════════════════════════
function handleChoiceClick(choiceId) {
  if (answered) return
  const correctCount = (curQuestion.choices || []).filter(c => c.is_correct).length
  if (correctCount > 1) {
    // Multi-select: přepínání výběru
    const btn = document.getElementById('cb-' + choiceId)
    if (selectedChoices.has(choiceId)) {
      selectedChoices.delete(choiceId)
      btn.classList.remove('selected')
    } else {
      selectedChoices.add(choiceId)
      btn.classList.add('selected')
    }
    document.getElementById('confirm-wrap').classList.toggle('hidden', selectedChoices.size === 0)
  } else {
    submitAnswer([choiceId])
  }
}

function confirmMultiAnswer() {
  if (answered || selectedChoices.size === 0) return
  submitAnswer([...selectedChoices])
}

async function submitAnswer(choiceIds) {
  if (answered) return
  answered = true
  clearInterval(timerInt)
  document.getElementById('confirm-wrap').classList.add('hidden')

  const choices     = curQuestion.choices || []
  const correctIds  = new Set(choices.filter(c => c.is_correct).map(c => c.id))
  const selectedSet = new Set(choiceIds)
  const isCorrect   = correctIds.size === selectedSet.size &&
                      [...correctIds].every(id => selectedSet.has(id))
  const timeTaken   = (Date.now() - qStartedAt) / 1000
  const pts         = isCorrect ? calcPoints(curQuestion.time_limit, timeTaken, curQuestion.points) : 0

  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('answered'))
  choiceIds.forEach(id => { const b = document.getElementById('cb-'+id); if(b) b.classList.add('selected') })

  doSubmit(choiceIds[0] || null, isCorrect, timeTaken, pts)
}

function submitTextAnswer() {
  if (answered) return
  const val = document.getElementById('text-ans')?.value.trim()
  if (!val) return
  const correct = (curQuestion.choices || []).find(c => c.is_correct)?.text || ''
  const isOk    = val.toLowerCase() === correct.toLowerCase()
  const t       = (Date.now() - qStartedAt) / 1000
  const pts     = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, val)
}

function submitNumericAnswer() {
  if (answered) return
  const val = document.getElementById('num-ans')?.value.trim()
  if (!val) return
  const correct = parseFloat((curQuestion.choices || []).find(c => c.is_correct)?.text || '0')
  const tol     = parseFloat(curQuestion.tolerance) || 0
  const isOk    = Math.abs(parseFloat(val) - correct) <= tol
  const t       = (Date.now() - qStartedAt) / 1000
  const pts     = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, val)
}

function submitOrdering() {
  if (answered) return
  const list = document.getElementById('ordering-list')
  if (!list) return
  const studentOrder = [...list.querySelectorAll('.order-item')].map(el => el.dataset.id)
  const correctOrder = (curQuestion.choices || []).slice()
    .sort((a,b) => a.order_index - b.order_index).map(c => c.id)
  const isOk = studentOrder.every((id, i) => id === correctOrder[i])
  const t    = (Date.now() - qStartedAt) / 1000
  const pts  = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, JSON.stringify(studentOrder))
}

async function doSubmit(choiceId, isCorrect, timeTaken, pts, textAnswer = null) {
  const newScore = (player.score || 0) + pts
  await sb.from('responses').insert({
    session_id: session.id, question_id: curQuestion.id, player_id: player.id,
    choice_id: choiceId, is_correct: isCorrect, time_taken: timeTaken,
    points_earned: pts, text_answer: textAnswer
  })
  await sb.from('players').update({ score: newScore }).eq('id', player.id)
  player.score = newScore
  setTimeout(() => showResult(isCorrect, timeTaken, pts), 400)
}

// ═══════════════════════════════════════════════
//  DRAG AND DROP (ordering)
// ═══════════════════════════════════════════════
let odSrc = null, otSrc = null, otGhost = null

function odStart(e)  { odSrc = e.currentTarget; odSrc.classList.add('dragging'); e.dataTransfer.effectAllowed='move' }
function odEnd(e)    { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.order-item').forEach(el=>el.classList.remove('drag-over')) }
function odOver(e)   { e.preventDefault(); if(e.currentTarget!==odSrc) e.currentTarget.classList.add('drag-over') }
function odLeave(e)  { e.currentTarget.classList.remove('drag-over') }
function odDrop(e)   {
  e.preventDefault()
  const tgt = e.currentTarget; tgt.classList.remove('drag-over')
  if (odSrc && tgt !== odSrc) {
    const list = tgt.parentNode
    const si = [...list.children].indexOf(odSrc), ti = [...list.children].indexOf(tgt)
    list.insertBefore(odSrc, si < ti ? tgt.nextSibling : tgt)
    updateOrdNums()
  }
}
function updateOrdNums() {
  document.querySelectorAll('#ordering-list .order-num').forEach((el, i) => el.textContent = i + 1)
}

function otStart(e) {
  if (answered) return; e.preventDefault()
  otSrc = e.currentTarget; otSrc.classList.add('dragging')
  const t = e.touches[0]
  otGhost = otSrc.cloneNode(true)
  Object.assign(otGhost.style, {
    position:'fixed', width: otSrc.offsetWidth+'px', opacity:'.75',
    pointerEvents:'none', zIndex:'999', margin:'0', borderRadius:'10px',
    left: t.clientX - otSrc.offsetWidth/2 + 'px',
    top:  t.clientY - 28 + 'px'
  })
  document.body.appendChild(otGhost)
}
function otMove(e) {
  e.preventDefault(); if (!otSrc) return
  const t = e.touches[0]
  if (otGhost) { otGhost.style.left = t.clientX - otSrc.offsetWidth/2 + 'px'; otGhost.style.top = t.clientY - 28 + 'px' }
  otGhost.style.display = 'none'
  const under = document.elementFromPoint(t.clientX, t.clientY)
  otGhost.style.display = ''
  document.querySelectorAll('.order-item').forEach(el => el.classList.remove('drag-over'))
  const tgt = under?.closest?.('.order-item')
  if (tgt && tgt !== otSrc) tgt.classList.add('drag-over')
}
function otEnd(e) {
  if (!otSrc) return
  const t = e.changedTouches[0]
  if (otGhost) { otGhost.style.display = 'none' }
  const under = document.elementFromPoint(t.clientX, t.clientY)
  if (otGhost) { otGhost.remove(); otGhost = null }
  document.querySelectorAll('.order-item').forEach(el => el.classList.remove('drag-over'))
  const tgt = under?.closest?.('.order-item')
  if (tgt && tgt !== otSrc) {
    const list = tgt.parentNode
    const si = [...list.children].indexOf(otSrc), ti = [...list.children].indexOf(tgt)
    list.insertBefore(otSrc, si < ti ? tgt.nextSibling : tgt)
    updateOrdNums()
  }
  otSrc.classList.remove('dragging'); otSrc = null
}

function showResult(isCorrect, timeTaken, pts) {
  playSound(isCorrect ? 'correct' : 'wrong')
  if (isCorrect) {
    document.getElementById('res-icon').textContent  = '✅'
    document.getElementById('res-label').textContent = 'Správně!'
    document.getElementById('res-pts').textContent   = '+' + pts.toLocaleString('cs-CZ')
    document.getElementById('res-pts').className     = 'result-pts ok'
    document.getElementById('res-sub').textContent   = `Odpověděl/a za ${timeTaken?.toFixed(1)} s`
  } else {
    document.getElementById('res-icon').textContent  = '❌'
    document.getElementById('res-label').textContent = 'Špatně'
    document.getElementById('res-pts').textContent   = '+0'
    document.getElementById('res-pts').className     = 'result-pts no'
    document.getElementById('res-sub').textContent   = timeTaken ? '' : 'Čas vypršel'
  }
  document.getElementById('res-total').textContent = `Celkem: ${player.score.toLocaleString('cs-CZ')} bodů`
  showView('result')
}

function calcPoints(limit, taken, base) {
  const ratio = Math.max(0, 1 - taken / limit)
  return Math.round(base * (0.5 + 0.5 * ratio))  // 50–100 % základních bodů
}

// ═══════════════════════════════════════════════
//  ŽEBŘÍČEK
// ═══════════════════════════════════════════════
async function showLeaderboard() {
  const { data: players } = await sb.from('players')
    .select('id, nickname, score, avatar').eq('session_id', session.id)
    .order('score', { ascending: false }).limit(10)

  const medals = ['🥇','🥈','🥉']
  document.getElementById('lb-list').innerHTML = (players||[]).map((p, i) => `
    <div class="lb-item ${p.id === player.id ? 'me' : ''}">
      <div class="lb-rank">${medals[i] || (i+1)}</div>
      <div class="lb-avatar">${p.avatar || '🎮'}</div>
      <div class="lb-name">${esc(p.nickname)}${p.id === player.id ? ' ← ty' : ''}</div>
      <div class="lb-score">${p.score.toLocaleString('cs-CZ')}</div>
    </div>`).join('')

  showView('leaderboard')
}

// ═══════════════════════════════════════════════
//  OBNOVA PO REFRESHI
// ═══════════════════════════════════════════════
async function rejoinSession(state) {
  const [{ data: p }, { data: sess }] = await Promise.all([
    sb.from('players').select('*').eq('id', state.playerId).single(),
    sb.from('sessions').select('*').eq('id', state.sessionId).single()
  ])

  if (!p || !sess) { sessionStorage.removeItem('kv_player'); return }

  player    = p
  session   = sess
  questions = null

  document.getElementById('lobby-name').textContent  = p.nickname
  document.getElementById('lobby-avatar').textContent = p.avatar || '🎮'
  document.getElementById('lobby-quiz').textContent   = sess.quiz_title || 'Kvíz'

  if (sess.status === 'finished') {
    sessionStorage.removeItem('kv_player')
    await showFinished()
    return
  }

  subscribeToSession(sess.id)

  if (sess.status === 'waiting') {
    showView('lobby')
  } else if (sess.status === 'active' && sess.current_question_index >= 0) {
    await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
  } else if (sess.status === 'leaderboard') {
    await showLeaderboard()
  }
}

// ═══════════════════════════════════════════════
//  KONEC KVÍZU
// ═══════════════════════════════════════════════
async function showFinished() {
  sessionStorage.removeItem('kv_player')
  if (sessionSub) { sessionSub.unsubscribe(); sessionSub = null }
  clearInterval(timerInt)
  playSound('finish')
  // Reset hvězdiček zpětné vazby
  feedbackDiff = 0; feedbackSelf = 0
  document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('on'))
  showView('feedback')
}

// ═══════════════════════════════════════════════
//  UTILITY
// ═══════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
