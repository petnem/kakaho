<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KvízApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg:          #080817;
      --card:        rgba(255,255,255,.06);
      --card2:       rgba(255,255,255,.11);
      --accent:      #f72585;
      --text:        #eef0ff;
      --muted:       #6b7cb3;
      --green:       #06ffa5;
      --red:         #ff3358;
      --blue:        #4895ef;
      --yellow:      #ffd60a;
      --purple:      #7c3aff;
      --glass-border: rgba(255,255,255,.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Nunito', sans-serif; color: var(--text);
      background:
        radial-gradient(ellipse 70% 60% at 12% 8%, rgba(247,37,133,.16) 0%, transparent 55%),
        radial-gradient(ellipse 65% 65% at 88% 88%, rgba(72,149,239,.13) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 55% 45%, rgba(124,58,255,.08) 0%, transparent 70%),
        #080817;
    }

    /* ── Decorative background shapes ── */
    .deco-shapes { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
    .deco-blob   { filter: blur(90px); border-radius: 50%; position: absolute; }
    .db1 { width: 600px; height: 600px; top: -200px; right: -180px; background: rgba(247,37,133,.28); }
    .db2 { width: 500px; height: 500px; bottom: -180px; left: -150px; background: rgba(114,9,183,.22); }
    .db3 { width: 350px; height: 350px; top: 38%; left: -120px; background: rgba(72,149,239,.18); }
    .db4 { width: 250px; height: 250px; top: 30%; right: -80px; background: rgba(72,149,239,.15); }
    .deco-ring   { position: absolute; border-radius: 50%; border: 2px solid; }
    .dr1 { width: 120px; height: 120px; top: 10%; right: 4%;   border-color: rgba(247,37,133,.35); }
    .dr2 { width: 80px;  height: 80px;  bottom: 16%; right: -15px; border-color: rgba(255,214,10,.35); }
    .dr3 { width: 60px;  height: 60px;  top: 52%; right: -12px;   border-color: rgba(124,58,255,.35); }

    /* ── View container ── */
    .view {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      padding: 1.5rem 1.25rem; overflow-y: auto;
    }
    .hidden { display: none !important; }

    /* ── JOIN ── */
    .join-top { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .join-logo { text-align: center; margin-bottom: 2.5rem; }
    .logo-text {
      font-size: 2.6rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 20px rgba(247,37,133,.4));
    }
    .logo-text span { -webkit-text-fill-color: var(--text); color: var(--text); filter: none; }
    .subtitle { color: var(--muted); margin-top: .25rem; }

    label {
      display: block; font-size: .82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: rgba(255,255,255,.5); margin-bottom: .4rem;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.14);
      border-radius: 14px; padding: .9rem 1rem; color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 700;
      outline: none; text-align: center; letter-spacing: .1em;
      margin-bottom: 1rem;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(247,37,133,.18), 0 0 20px rgba(247,37,133,.12);
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,.2); }
    input:focus { border-color: var(--accent); }
    .error-msg { color: var(--red); font-size: .9rem; text-align: center; margin-bottom: .75rem; min-height: 1.2em; }

    .btn {
      width: 100%; padding: 1rem; border-radius: 14px; border: none;
      cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 24px rgba(247,37,133,.4), 0 1px 0 rgba(255,255,255,.1) inset;
    }
    .btn-primary:hover { box-shadow: 0 6px 32px rgba(247,37,133,.55); }
    .btn-success {
      background: linear-gradient(135deg, #06ffa5, #00b4ff);
      color: #001a0d; font-weight: 900;
      box-shadow: 0 4px 24px rgba(6,255,165,.35);
    }

    /* ── LOBBY ── */
    .lobby-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: none;
    }
    .avatar {
      font-size: 6rem; margin-bottom: 1.25rem;
      animation: float 3.5s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.4));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%       { transform: translateY(-14px) rotate(2deg); }
    }
    .lobby-name { font-size: 1.8rem; font-weight: 900; color: var(--text); margin-bottom: .5rem; }
    .pulse-wrap { color: var(--muted); font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: .5rem; }
    .pulse {
      width: 10px; height: 10px; background: var(--green); border-radius: 50%;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 8px rgba(6,255,165,.6);
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
    .quiz-badge {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; backdrop-filter: blur(8px);
      padding: .65rem 1.25rem; margin-top: 1.5rem;
      color: var(--text); font-weight: 700; font-size: .95rem;
    }

    /* ── QUESTION ── */
    .q-header {
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px; padding: 1.2rem 1rem; margin-bottom: .9rem; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
    }
    .q-meta  { color: rgba(255,255,255,.4); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; }
    .q-text  { font-size: 1.2rem; font-weight: 800; color: var(--text); line-height: 1.35; margin-top: .4rem; }
    .q-timer { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin-top: .45rem;
               text-shadow: 0 0 12px rgba(247,37,133,.5); }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .choice-btn {
      border: none; border-radius: 16px; padding: .9rem .65rem;
      cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: .95rem; font-weight: 800; color: white;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 96px; text-align: center;
      line-height: 1.25; transition: transform .15s, box-shadow .15s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
      position: relative; overflow: hidden;
    }
    .choice-btn::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(to bottom, rgba(255,255,255,.12), transparent);
      border-radius: 16px 16px 0 0;
    }
    .choice-btn:active { transform: scale(.93); }
    .choice-btn.answered { opacity: .4; pointer-events: none; }
    .choice-btn.selected { outline: 3px solid rgba(255,255,255,.8); box-shadow: 0 0 0 6px rgba(255,255,255,.15) !important; opacity: 1; }
    .cbA { background: linear-gradient(145deg,#ff1e56,#a3003b); box-shadow: 0 6px 28px rgba(255,30,86,.45); }
    .cbB { background: linear-gradient(145deg,#2979ff,#1340cc); box-shadow: 0 6px 28px rgba(41,121,255,.4); }
    .cbC { background: linear-gradient(145deg,#ff7c00,#c24800); box-shadow: 0 6px 28px rgba(255,124,0,.4); }
    .cbD { background: linear-gradient(145deg,#00d97e,#007848); box-shadow: 0 6px 28px rgba(0,217,126,.4); }
    .cb-icon { font-size: 1.5rem; margin-bottom: .25rem; }
    .cb-text { font-size: .88rem; }

    /* ── RESULT ── */
    @keyframes resultIn {
      0%   { transform: scale(.5) translateY(30px); opacity: 0; }
      70%  { transform: scale(1.05) translateY(-4px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .result-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      animation: resultIn .45s cubic-bezier(.34,1.56,.64,1);
    }
    .result-icon  { font-size: 5.5rem; margin-bottom: .75rem; }
    .result-label { font-size: 1.8rem; font-weight: 900; color: var(--text); }
    .result-pts   { font-size: 3rem; font-weight: 900; }
    .result-pts.ok { color: var(--green); text-shadow: 0 0 24px rgba(6,255,165,.45); }
    .result-pts.no { color: var(--red);   text-shadow: 0 0 18px rgba(255,51,88,.35); }
    .result-sub   { color: var(--muted); margin-top: .35rem; }
    .result-total { margin-top: 1.2rem; font-size: .95rem; color: var(--muted); }
    .result-correct {
      margin-top: .85rem;
      background: rgba(247,37,133,.1);
      border: 1.5px solid rgba(247,37,133,.3);
      border-radius: 12px; padding: .6rem 1.1rem;
      font-size: .92rem; font-weight: 700; color: var(--text);
      backdrop-filter: blur(8px);
    }

    /* ── WAITING ── */
    .waiting-rings {
      position: relative; width: 80px; height: 80px;
      margin: 0 auto 1.75rem; display: flex; align-items: center; justify-content: center;
    }
    .waiting-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid;
      animation: ringPulse 2.1s ease-out infinite;
    }
    .waiting-ring:nth-child(1) { border-color: var(--blue);   animation-delay: 0s; }
    .waiting-ring:nth-child(2) { border-color: var(--accent); animation-delay: .7s; }
    .waiting-ring:nth-child(3) { border-color: var(--purple); animation-delay: 1.4s; }
    @keyframes ringPulse {
      0%   { transform: scale(1); opacity: .85; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .waiting-spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(72,149,239,.2);
      border-top-color: var(--blue);
      animation: spin .85s linear infinite;
      filter: drop-shadow(0 0 8px rgba(72,149,239,.6));
      position: relative; z-index: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waiting-label { font-size: 1.6rem; font-weight: 900; margin-bottom: .45rem; color: var(--text); }
    .waiting-sub   { color: var(--muted); font-size: 1rem; }

    /* ── LEADERBOARD ── */
    .lb-title {
      font-size: 1.5rem; font-weight: 900; margin-bottom: 1.1rem; text-align: center;
      background: linear-gradient(135deg, #ffd60a, #ff9500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .lb-list  { display: flex; flex-direction: column; gap: .55rem; }
    .lb-item  {
      background: rgba(255,255,255,.06); border-radius: 14px; padding: .85rem 1rem;
      display: flex; align-items: center; gap: .8rem;
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
      transition: transform .15s;
    }
    .lb-item.me {
      background: rgba(247,37,133,.12);
      border-color: rgba(247,37,133,.35);
      box-shadow: 0 0 0 1px rgba(247,37,133,.25), 0 4px 20px rgba(247,37,133,.2);
    }
    .lb-rank  { font-size: 1.25rem; font-weight: 900; width: 32px; text-align: center; color: var(--yellow); }
    .lb-name  { flex: 1; font-weight: 700; color: var(--text); }
    .lb-score { font-weight: 900; color: var(--yellow); font-size: 1.05rem;
                text-shadow: 0 0 12px rgba(255,214,10,.35); }
    .lb-wait  { text-align: center; color: var(--muted); padding: 2rem; }

    /* ── FINISHED ── */
    @keyframes celebIn {
      0%   { transform: scale(.2) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .fin-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .fin-icon  { font-size: 5.5rem; margin-bottom: 1rem; animation: celebIn .6s cubic-bezier(.34,1.56,.64,1); }
    .fin-title { font-size: 2rem; font-weight: 900; color: var(--text); margin-bottom: .75rem; }
    .fin-score {
      font-size: 3.5rem; font-weight: 900;
      background: linear-gradient(135deg, #ffd60a, #ff9500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 16px rgba(255,214,10,.3));
    }
    .fin-sub  { color: var(--muted); margin-top: .4rem; }
    .fin-rank { margin-top: 1rem; font-size: .95rem; color: var(--muted); }

    /* ── Avatar picker ── */
    .avatar-section { margin: .5rem 0 .75rem; }
    .avatar-picker  { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-top: .4rem; }
    .avatar-btn {
      font-size: 1.65rem;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: .3rem .45rem; cursor: pointer; line-height: 1;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .avatar-btn:hover { background: rgba(255,255,255,.12); transform: scale(1.1); }
    .avatar-btn.sel {
      border-color: var(--accent);
      background: rgba(247,37,133,.18);
      transform: scale(1.25);
      box-shadow: 0 0 12px rgba(247,37,133,.4);
    }

    /* ── Feedback ── */
    .feedback-wrap  { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 1rem 0; background: none; }
    .feedback-title { font-size: 1.8rem; font-weight: 900; text-align: center; color: var(--text); }
    .feedback-block { text-align: center; }
    .feedback-q     { font-size: 1rem; font-weight: 700; margin-bottom: .5rem; color: var(--text); }
    .star-row       { display: flex; gap: .3rem; justify-content: center; }
    .star-btn       { font-size: 2.4rem; background: none; border: none; cursor: pointer; line-height:1;
                      color: rgba(255,255,255,.18); transition: color .12s, transform .12s;
                      -webkit-tap-highlight-color:transparent; }
    .star-btn:active { transform: scale(.9); }
    .star-btn.on    { color: #ffd60a; filter: drop-shadow(0 0 8px rgba(255,214,10,.7)); transform: scale(1.2); }
    .feedback-hint  { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
    .skip-btn       { background: none; border: none; color: var(--muted); font-family: 'Nunito', sans-serif;
                      cursor: pointer; font-size: .9rem; -webkit-tap-highlight-color:transparent; }

    /* ── LB avatar ── */
    .lb-avatar { font-size: 1.4rem; }

    /* ── Question image ── */
    .q-image { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin-bottom: .75rem; display: none; }
    .q-image.visible { display: block; }

    /* ── Multi-select ── */
    .q-multi-hint { font-size: .8rem; color: var(--muted); text-align: center; margin-bottom: .5rem; }
    .confirm-wrap { margin-top: .75rem; }

    /* ── Text / Numeric answer ── */
    .text-answer-wrap { grid-column: 1/-1; }
    .text-answer-wrap input[type="text"],
    .text-answer-wrap input[type="number"] {
      width: 100%;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.14);
      border-radius: 12px; padding: .9rem 1rem; color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 1.25rem; font-weight: 700;
      outline: none; text-align: center; margin-bottom: .75rem; transition: border-color .15s;
    }
    .text-answer-wrap input[type="text"]::placeholder,
    .text-answer-wrap input[type="number"]::placeholder { color: rgba(255,255,255,.2); }
    .text-answer-wrap input:focus { border-color: var(--accent); }

    /* ── Ordering ── */
    .ordering-wrap { grid-column: 1/-1; }
    .ordering-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    .order-item {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: .85rem 1rem;
      display: flex; align-items: center; gap: .75rem;
      cursor: grab; user-select: none; font-weight: 700; touch-action: none;
      color: var(--text); backdrop-filter: blur(6px);
      transition: opacity .15s;
    }
    .order-item.dragging  { opacity: .35; cursor: grabbing; }
    .order-item.drag-over { outline: 2px solid var(--accent); }
    .drag-handle { font-size: 1.2rem; color: var(--muted); flex-shrink: 0; }
    .order-num   {
      width: 26px; height: 26px;
      background: rgba(255,255,255,.1); color: var(--text);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 900; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="deco-blob db1"></div>
  <div class="deco-blob db2"></div>
  <div class="deco-blob db3"></div>
  <div class="deco-blob db4"></div>
  <div class="deco-ring dr1"></div>
  <div class="deco-ring dr2"></div>
  <div class="deco-ring dr3"></div>
</div>

        <button class="avatar-btn" onclick="pickAvatar(this,'🦩')">🦩</button>

        <button class="avatar-btn" onclick="pickAvatar(this,'👻')">👻</button>

      <div style="font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.35rem;">Známka</div>
      <div id="fin-grade-val" style="font-size:4rem; font-weight:900; line-height:1;"></div>
      <div id="fin-grade-lbl" style="font-size:.9rem; color:var(--muted); margin-top:.25rem;"></div>
    </div>

<script>
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Stav
let player          = null
let session         = null
let questions       = null
let curQuestion     = null
let qStartedAt      = null
let answered        = false
let pendingResult   = null   // { isCorrect, timeTaken, pts } – čeká na question_revealed
let timerInt        = null
let sessionSub      = null
let selectedChoices = new Set()
let selectedAvatar  = '🎮'
let feedbackDiff    = 0
let feedbackSelf    = 0

// ═══════════════════════════════════════════════
//  AVATAR
// ═══════════════════════════════════════════════
function pickAvatar(btn, emoji) {
  document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('sel'))
  btn.classList.add('sel')
  selectedAvatar = emoji
}


// ═══════════════════════════════════════════════
//  ZPĚTNÁ VAZBA
// ═══════════════════════════════════════════════
function setDiff(n) {
  feedbackDiff = n
  document.querySelectorAll('#diff-stars .star-btn').forEach((b,i) => b.classList.toggle('on', i < n))
}
function setSelf(n) {
  feedbackSelf = n
  document.querySelectorAll('#self-stars .star-btn').forEach((b,i) => b.classList.toggle('on', i < n))
}
async function submitFeedback() {
  if (feedbackDiff > 0 || feedbackSelf > 0) {
    await sb.from('feedback').insert({
      session_id:  session.id,
      player_id:   player.id,
      difficulty:  feedbackDiff || null,
      self_rating: feedbackSelf || null
    })
  }
  showActualFinished()
}
async function showActualFinished() {
  const [{ data: players }, { data: quiz }] = await Promise.all([
    sb.from('players').select('id, score').eq('session_id', session.id).order('score', { ascending: false }),
    sb.from('quizzes').select('grading_scale').eq('id', session.quiz_id).single()
  ])
  const rank = (players||[]).findIndex(p => p.id === player.id) + 1
  document.getElementById('fin-score').textContent = player.score.toLocaleString('cs-CZ')
  document.getElementById('fin-rank').textContent  = `${rank}. místo z ${players?.length || 0} hráčů`

  // Zobraz známku, pokud je hodnocení zapnuté
  const gs = quiz?.grading_scale
  const gradeEl = document.getElementById('fin-grade')
  if (gs?.enabled) {
    const total = session.total_questions || 1
    const { data: myResponses } = await sb.from('responses')
      .select('is_correct').eq('session_id', session.id).eq('player_id', player.id)
    const correct = (myResponses||[]).filter(r => r.is_correct).length
    const pct = Math.round(correct / total * 100)
    const t = gs.thresholds || [90,75,50,25]
    const grade = pct >= t[0] ? 1 : pct >= t[1] ? 2 : pct >= t[2] ? 3 : pct >= t[3] ? 4 : 5
    const labels = {1:'Výborný',2:'Chvalitebný',3:'Dobrý',4:'Dostatečný',5:'Nedostatečný'}
    const colors = {1:'var(--green)',2:'var(--blue)',3:'var(--yellow)',4:'#ff6b6b',5:'var(--muted)'}
    document.getElementById('fin-grade-val').textContent = grade
    document.getElementById('fin-grade-val').style.color = colors[grade]
    document.getElementById('fin-grade-lbl').textContent = `${labels[grade]} · ${pct} %`
    gradeEl.classList.remove('hidden')
  } else {
    gradeEl.classList.add('hidden')
  }

  showView('finished')
}

// ═══════════════════════════════════════════════
//  INIT – obnov session nebo předvyplň PIN
// ═══════════════════════════════════════════════
;(async function init() {
  const saved = sessionStorage.getItem('kv_player')
  if (saved) {
    try {
      await rejoinSession(JSON.parse(saved))
      return
    } catch(e) {
      sessionStorage.removeItem('kv_player')
    }
  }
  const pin = new URLSearchParams(window.location.search).get('pin')
  if (pin) {
    document.getElementById('pin-input').value = pin
    setTimeout(() => document.getElementById('nick-input').focus(), 100)
  }
})()

function showView(n) {
  document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'))
  document.getElementById('view-' + n).classList.remove('hidden')
}

// ═══════════════════════════════════════════════
//  PŘIPOJENÍ
// ═══════════════════════════════════════════════
async function joinSession() {
  const pin  = document.getElementById('pin-input').value.trim()
  const nick = document.getElementById('nick-input').value.trim()
  const err  = document.getElementById('join-error')
  const btn  = document.querySelector('#view-join .btn-primary')
  err.textContent = ''

  if (!pin || pin.length !== 6)  { err.textContent = 'Zadej 6místný PIN.';          return }
  if (!nick)                      { err.textContent = 'Zadej přezdívku.';             return }
  if (nick.length < 2)            { err.textContent = 'Přezdívka je příliš krátká.'; return }

  btn.disabled = true; btn.textContent = '…'

  // Najdi relaci (waiting = čeká, active = právě probíhá – pozdní připojení)
  const { data: sess, error } = await sb.from('sessions')
    .select('*').eq('pin', pin).in('status', ['waiting', 'active']).single()
  if (error || !sess) {
    err.textContent = 'Kvíz nenalezen nebo již skončil.'
    btn.disabled = false; btn.textContent = 'Připojit se →'
    return
  }

  // Upsert: pokud stejné jméno v relaci existuje (ztráta sessionStorage), vrátí stávajícího hráče
  const { data: p, error: pErr } = await sb.from('players')
    .upsert({ session_id: sess.id, nickname: nick, score: 0, avatar: selectedAvatar },
            { onConflict: 'session_id,nickname', ignoreDuplicates: false })
    .select().single()
  if (pErr || !p) {
    err.textContent = 'Chyba připojení – zkus to znovu.'
    btn.disabled = false; btn.textContent = 'Připojit se →'
    return
  }

  player    = p
  session   = sess
  questions = null

  // Ulož stav pro případ refreshe
  sessionStorage.setItem('kv_player', JSON.stringify({ playerId: p.id, sessionId: sess.id }))

  document.getElementById('lobby-name').textContent = nick
  document.getElementById('lobby-avatar').textContent = selectedAvatar
  document.getElementById('lobby-quiz').textContent = sess.quiz_title || 'Kvíz'

  subscribeToSession(sess.id)
  if (sess.status === 'waiting') {
    showView('lobby')
  } else {
    // Pozdní připojení – rovnou na aktuální otázku
    await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
  }
}

// ═══════════════════════════════════════════════
//  REALTIME – sleduj změny relace
// ═══════════════════════════════════════════════
function subscribeToSession(sessionId) {
  if (sessionSub) sessionSub.unsubscribe()
  sessionSub = sb.channel('sess-watch-' + sessionId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'sessions',
      filter: `id=eq.${sessionId}`
    }, payload => handleSessionUpdate(payload.new))
    .subscribe(async status => {
      // Při navázání subscription ověř aktuální stav – mohli jsme propásnout UPDATE
      if (status === 'SUBSCRIBED') {
        const { data: s } = await sb.from('sessions').select('*').eq('id', sessionId).single()
        if (s && s.status !== 'waiting') handleSessionUpdate(s)
      }
    })
}

async function handleSessionUpdate(sess) {
  const prevQIdx = session?.current_question_index ?? -1
  session = sess
  // Odhalení musí mít prioritu – status zůstává 'active', takže by ho přebila druhá podmínka
  if (sess.question_revealed && pendingResult) {
    const r = pendingResult
    pendingResult = null
    showResult(r.isCorrect, r.timeTaken, r.pts)
    return
  }
  if (sess.status === 'active' && sess.current_question_index >= 0) {
    // Načti otázku jen při skutečné změně indexu – jinak jen answers_count / question_revealed update
    if (sess.current_question_index !== prevQIdx) {
      await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
    }
    return
  }
  if (sess.status === 'leaderboard') await showLeaderboard()
  if (sess.status === 'finished')    showFinished()
}

// ═══════════════════════════════════════════════
//  OTÁZKA
// ═══════════════════════════════════════════════
async function loadQuestion(quizId, idx, startedAt) {
  answered        = false
  pendingResult   = null
  qStartedAt      = new Date(startedAt)
  selectedChoices = new Set()

  if (!questions) {
    const { data: qs } = await sb.from('questions')
      .select('*, choices(*)').eq('quiz_id', quizId).order('order_index')
    questions = qs
  }
  curQuestion = questions[idx]
  if (!curQuestion) return

  const qType  = curQuestion.type || 'multiple_choice'
  const sorted = (curQuestion.choices || []).slice().sort((a,b) => a.order_index - b.order_index)

  document.getElementById('q-meta').textContent = `Otázka ${idx+1} / ${session.total_questions}`
  document.getElementById('q-text').textContent = curQuestion.text
  document.getElementById('q-multi-hint').classList.add('hidden')
  document.getElementById('confirm-wrap').classList.add('hidden')

  const imgEl = document.getElementById('q-image')
  if (curQuestion.image_url) { imgEl.src = curQuestion.image_url; imgEl.classList.add('visible') }
  else                        { imgEl.src = '';                    imgEl.classList.remove('visible') }

  const choicesEl = document.getElementById('choices')

  if (qType === 'multiple_choice' || qType === 'true_false') {
    const icons = qType === 'true_false' ? ['✓','✗'] : ['▲','◆','●','■']
    const cls   = qType === 'true_false' ? ['cbA','cbB'] : ['cbA','cbB','cbC','cbD']
    choicesEl.innerHTML = sorted.map((c, i) => `
      <button class="choice-btn ${cls[i]}" id="cb-${c.id}" onclick="handleChoiceClick('${c.id}')">
        <div class="cb-icon">${icons[i]}</div>
        <div class="cb-text">${esc(c.text)}</div>
      </button>`).join('')

    if (qType === 'multiple_choice' && sorted.filter(c => c.is_correct).length > 1) {
      document.getElementById('q-multi-hint').classList.remove('hidden')
    }

  } else if (qType === 'text') {
    choicesEl.innerHTML = `
      <div class="text-answer-wrap">
        <input type="text" id="text-ans" placeholder="Napiš odpověď…"
               onkeydown="if(event.key==='Enter') submitTextAnswer()">
        <button class="btn btn-success" onclick="submitTextAnswer()">Odeslat →</button>
      </div>`
    setTimeout(() => document.getElementById('text-ans')?.focus(), 120)

  } else if (qType === 'numeric') {
    choicesEl.innerHTML = `
      <div class="text-answer-wrap">
        <input type="number" id="num-ans" step="any" placeholder="Zadej číslo…"
               onkeydown="if(event.key==='Enter') submitNumericAnswer()">
        <button class="btn btn-success" onclick="submitNumericAnswer()">Odeslat →</button>
      </div>`
    setTimeout(() => document.getElementById('num-ans')?.focus(), 120)

  } else if (qType === 'ordering') {
    const shuffled = [...sorted].sort(() => Math.random() - 0.5)
    choicesEl.innerHTML = `
      <div class="ordering-wrap">
        <div id="ordering-list" class="ordering-list">
          ${shuffled.map((c, i) => `
            <div class="order-item" data-id="${c.id}" draggable="true"
                 ondragstart="odStart(event)" ondragover="odOver(event)"
                 ondragleave="odLeave(event)" ondrop="odDrop(event)" ondragend="odEnd(event)"
                 ontouchstart="otStart(event)" ontouchmove="otMove(event)" ontouchend="otEnd(event)">
              <span class="drag-handle">≡</span>
              <span class="order-num">${i + 1}</span>
              <span style="flex:1">${esc(c.text)}</span>
            </div>`).join('')}
        </div>
        <button class="btn btn-success" onclick="submitOrdering()">Potvrdit pořadí →</button>
      </div>`
  }

  showView('question')

  // After refresh: check if player already answered this question
  const { data: prevResp } = await sb.from('responses')
    .select('id, is_correct, time_taken, points_earned').eq('session_id', session.id)
    .eq('question_id', curQuestion.id).eq('player_id', player.id)
    .maybeSingle()
  if (prevResp) {
    answered = true
    document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('answered'))
    const ta = document.getElementById('text-ans'); if (ta) ta.disabled = true
    const na = document.getElementById('num-ans'); if (na) na.disabled = true
    document.getElementById('confirm-wrap').classList.add('hidden')
    if (session.question_revealed) {
      // Otázka již odhalena – rovnou výsledek
      showResult(prevResp.is_correct, prevResp.time_taken, prevResp.points_earned)
    } else {
      // Čekáme na odhalení
      pendingResult = { isCorrect: prevResp.is_correct, timeTaken: prevResp.time_taken, pts: prevResp.points_earned }
      showView('waiting')
    }
  }

  startCountdown(curQuestion.time_limit, startedAt)
}

function startCountdown(limit, startedAt) {
  clearInterval(timerInt)
  const start = new Date(startedAt)
  const el    = document.getElementById('q-timer')

  function tick() {
    const elapsed   = (Date.now() - start) / 1000
    const remaining = Math.max(0, limit - elapsed)
    el.textContent  = Math.ceil(remaining) + 's'
    el.style.color  = remaining < 5 ? 'var(--red)' : remaining < 10 ? 'var(--yellow)' : 'var(--accent)'
    if (remaining <= 0) {
      clearInterval(timerInt)
      if (!answered) { answered = true; pendingResult = { isCorrect: false, timeTaken: null, pts: 0 }; showView('waiting') }
    }
  }
  tick()
  timerInt = setInterval(tick, 500)
}

// ═══════════════════════════════════════════════
//  ODPOVĚĎ
// ═══════════════════════════════════════════════
function handleChoiceClick(choiceId) {
  if (answered) return
  const correctCount = (curQuestion.choices || []).filter(c => c.is_correct).length
  if (correctCount > 1) {
    // Multi-select: přepínání výběru
    const btn = document.getElementById('cb-' + choiceId)
    if (selectedChoices.has(choiceId)) {
      selectedChoices.delete(choiceId)
      btn.classList.remove('selected')
    } else {
      selectedChoices.add(choiceId)
      btn.classList.add('selected')
    }
    document.getElementById('confirm-wrap').classList.toggle('hidden', selectedChoices.size === 0)
  } else {
    submitAnswer([choiceId])
  }
}

function confirmMultiAnswer() {
  if (answered || selectedChoices.size === 0) return
  submitAnswer([...selectedChoices])
}

async function submitAnswer(choiceIds) {
  if (answered) return
  answered = true
  clearInterval(timerInt)
  document.getElementById('confirm-wrap').classList.add('hidden')

  const choices     = curQuestion.choices || []
  const correctIds  = new Set(choices.filter(c => c.is_correct).map(c => c.id))
  const selectedSet = new Set(choiceIds)
  const isCorrect   = correctIds.size === selectedSet.size &&
                      [...correctIds].every(id => selectedSet.has(id))
  const timeTaken   = (Date.now() - qStartedAt) / 1000
  const pts         = isCorrect ? calcPoints(curQuestion.time_limit, timeTaken, curQuestion.points) : 0

  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('answered'))
  choiceIds.forEach(id => { const b = document.getElementById('cb-'+id); if(b) b.classList.add('selected') })

  doSubmit(choiceIds[0] || null, isCorrect, timeTaken, pts)
}

function submitTextAnswer() {
  if (answered) return
  const val = document.getElementById('text-ans')?.value.trim()
  if (!val) return
  const correct = (curQuestion.choices || []).find(c => c.is_correct)?.text || ''
  const isOk    = val.toLowerCase() === correct.toLowerCase()
  const t       = (Date.now() - qStartedAt) / 1000
  const pts     = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, val)
}

function submitNumericAnswer() {
  if (answered) return
  const val = document.getElementById('num-ans')?.value.trim()
  if (!val) return
  const correct = parseFloat((curQuestion.choices || []).find(c => c.is_correct)?.text || '0')
  const tol     = parseFloat(curQuestion.tolerance) || 0
  const isOk    = Math.abs(parseFloat(val) - correct) <= tol
  const t       = (Date.now() - qStartedAt) / 1000
  const pts     = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, val)
}

function submitOrdering() {
  if (answered) return
  const list = document.getElementById('ordering-list')
  if (!list) return
  const studentOrder = [...list.querySelectorAll('.order-item')].map(el => el.dataset.id)
  const correctOrder = (curQuestion.choices || []).slice()
    .sort((a,b) => a.order_index - b.order_index).map(c => c.id)
  const isOk = studentOrder.every((id, i) => id === correctOrder[i])
  const t    = (Date.now() - qStartedAt) / 1000
  const pts  = isOk ? calcPoints(curQuestion.time_limit, t, curQuestion.points) : 0
  answered = true; clearInterval(timerInt)
  doSubmit(null, isOk, t, pts, JSON.stringify(studentOrder))
}

async function doSubmit(choiceId, isCorrect, timeTaken, pts, textAnswer = null) {
  const newScore = (player.score || 0) + pts
  // Nastav před await: pokud handleSessionUpdate() zachytí question_revealed dřív než await
  // dokončí, spotřebuje pendingResult a ukáže výsledek – pak se waiting nezobrazí
  player.score = newScore
  pendingResult = { isCorrect, timeTaken, pts }
  await sb.from('responses').insert({
    session_id: session.id, question_id: curQuestion.id, player_id: player.id,
    choice_id: choiceId, is_correct: isCorrect, time_taken: timeTaken,
    points_earned: pts, text_answer: textAnswer
  })
  await sb.from('players').update({ score: newScore }).eq('id', player.id)
  if (pendingResult) showView('waiting')
}

// ═══════════════════════════════════════════════
//  DRAG AND DROP (ordering)
// ═══════════════════════════════════════════════
let odSrc = null, otSrc = null, otGhost = null

function odStart(e)  { odSrc = e.currentTarget; odSrc.classList.add('dragging'); e.dataTransfer.effectAllowed='move' }
function odEnd(e)    { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.order-item').forEach(el=>el.classList.remove('drag-over')) }
function odOver(e)   { e.preventDefault(); if(e.currentTarget!==odSrc) e.currentTarget.classList.add('drag-over') }
function odLeave(e)  { e.currentTarget.classList.remove('drag-over') }
function odDrop(e)   {
  e.preventDefault()
  const tgt = e.currentTarget; tgt.classList.remove('drag-over')
  if (odSrc && tgt !== odSrc) {
    const list = tgt.parentNode
    const si = [...list.children].indexOf(odSrc), ti = [...list.children].indexOf(tgt)
    list.insertBefore(odSrc, si < ti ? tgt.nextSibling : tgt)
    updateOrdNums()
  }
}
function updateOrdNums() {
  document.querySelectorAll('#ordering-list .order-num').forEach((el, i) => el.textContent = i + 1)
}

function otStart(e) {
  if (answered) return; e.preventDefault()
  otSrc = e.currentTarget; otSrc.classList.add('dragging')
  const t = e.touches[0]
  otGhost = otSrc.cloneNode(true)
  Object.assign(otGhost.style, {
    position:'fixed', width: otSrc.offsetWidth+'px', opacity:'.75',
    pointerEvents:'none', zIndex:'999', margin:'0', borderRadius:'10px',
    left: t.clientX - otSrc.offsetWidth/2 + 'px',
    top:  t.clientY - 28 + 'px'
  })
  document.body.appendChild(otGhost)
}
function otMove(e) {
  e.preventDefault(); if (!otSrc) return
  const t = e.touches[0]
  if (otGhost) { otGhost.style.left = t.clientX - otSrc.offsetWidth/2 + 'px'; otGhost.style.top = t.clientY - 28 + 'px' }
  if (otGhost) otGhost.style.display = 'none'
  const under = document.elementFromPoint(t.clientX, t.clientY)
  if (otGhost) otGhost.style.display = ''
  document.querySelectorAll('.order-item').forEach(el => el.classList.remove('drag-over'))
  const tgt = under?.closest?.('.order-item')
  if (tgt && tgt !== otSrc) tgt.classList.add('drag-over')
}
function otEnd(e) {
  if (!otSrc) return
  const t = e.changedTouches[0]
  if (otGhost) { otGhost.style.display = 'none' }
  const under = document.elementFromPoint(t.clientX, t.clientY)
  if (otGhost) { otGhost.remove(); otGhost = null }
  document.querySelectorAll('.order-item').forEach(el => el.classList.remove('drag-over'))
  const tgt = under?.closest?.('.order-item')
  if (tgt && tgt !== otSrc) {
    const list = tgt.parentNode
    const si = [...list.children].indexOf(otSrc), ti = [...list.children].indexOf(tgt)
    list.insertBefore(otSrc, si < ti ? tgt.nextSibling : tgt)
    updateOrdNums()
  }
  otSrc.classList.remove('dragging'); otSrc = null
}

function showResult(isCorrect, timeTaken, pts) {
  if (isCorrect) {
    document.getElementById('res-icon').textContent  = '✅'
    document.getElementById('res-label').textContent = 'Správně!'
    document.getElementById('res-pts').textContent   = '+' + pts.toLocaleString('cs-CZ')
    document.getElementById('res-pts').className     = 'result-pts ok'
    document.getElementById('res-sub').textContent   = `Odpověděl/a za ${timeTaken?.toFixed(1)} s`
  } else {
    document.getElementById('res-icon').textContent  = '❌'
    document.getElementById('res-label').textContent = 'Špatně'
    document.getElementById('res-pts').textContent   = '+0'
    document.getElementById('res-pts').className     = 'result-pts no'
    document.getElementById('res-sub').textContent   = timeTaken ? '' : 'Čas vypršel'
  }
  const correctEl = document.getElementById('res-correct')
  if (!isCorrect && curQuestion) {
    const correct = (curQuestion.choices || []).find(c => c.is_correct)
    if (correct) {
      correctEl.textContent = '✓ Správná odpověď: ' + correct.text
      correctEl.classList.remove('hidden')
    } else {
      correctEl.classList.add('hidden')
    }
  } else {
    correctEl.classList.add('hidden')
  }
  document.getElementById('res-total').textContent = `Celkem: ${player.score.toLocaleString('cs-CZ')} bodů`
  showView('result')
}

function calcPoints(limit, taken, base) {
  const ratio = Math.max(0, 1 - taken / limit)
  return Math.round(base * (0.5 + 0.5 * ratio))  // 50–100 % základních bodů
}

// ═══════════════════════════════════════════════
//  ŽEBŘÍČEK
// ═══════════════════════════════════════════════
async function showLeaderboard() {
  const { data: players } = await sb.from('players')
    .select('id, nickname, score, avatar').eq('session_id', session.id)
    .order('score', { ascending: false }).limit(10)

  const medals = ['🥇','🥈','🥉']
  document.getElementById('lb-list').innerHTML = (players||[]).map((p, i) => `
    <div class="lb-item ${p.id === player.id ? 'me' : ''}">
      <div class="lb-rank">${medals[i] || (i+1)}</div>
      <div class="lb-avatar">${p.avatar || '🎮'}</div>
      <div class="lb-name">${esc(p.nickname)}${p.id === player.id ? ' ← ty' : ''}</div>
      <div class="lb-score">${p.score.toLocaleString('cs-CZ')}</div>
    </div>`).join('')

  if (session?.status === 'finished') return
  showView('leaderboard')
}

// ═══════════════════════════════════════════════
//  OBNOVA PO REFRESHI
// ═══════════════════════════════════════════════
async function rejoinSession(state) {
  const [{ data: p }, { data: sess }] = await Promise.all([
    sb.from('players').select('*').eq('id', state.playerId).single(),
    sb.from('sessions').select('*').eq('id', state.sessionId).single()
  ])

  if (!p || !sess) { sessionStorage.removeItem('kv_player'); return }

  player    = p
  session   = sess
  questions = null

  document.getElementById('lobby-name').textContent  = p.nickname
  document.getElementById('lobby-avatar').textContent = p.avatar || '🎮'
  document.getElementById('lobby-quiz').textContent   = sess.quiz_title || 'Kvíz'

  if (sess.status === 'finished') {
    sessionStorage.removeItem('kv_player')
    await showFinished()
    return
  }

  subscribeToSession(sess.id)

  if (sess.status === 'waiting') {
    showView('lobby')
  } else if (sess.status === 'active' && sess.current_question_index >= 0) {
    await loadQuestion(sess.quiz_id, sess.current_question_index, sess.question_started_at)
  } else if (sess.status === 'leaderboard') {
    await showLeaderboard()
  }
}

// ═══════════════════════════════════════════════
//  KONEC KVÍZU
// ═══════════════════════════════════════════════
async function showFinished() {
  sessionStorage.removeItem('kv_player')
  if (sessionSub) { sessionSub.unsubscribe(); sessionSub = null }
  clearInterval(timerInt)
  // Reset hvězdiček zpětné vazby
  feedbackDiff = 0; feedbackSelf = 0
  document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('on'))
  showView('feedback')
}

// ═══════════════════════════════════════════════
//  UTILITY
// ═══════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
