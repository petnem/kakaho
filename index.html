<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KvízApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #1a1a2e; color: #eaeaea;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
    }
    .logo { font-size: 3rem; font-weight: 900; color: #e94560; margin-bottom: .25rem; }
    .logo span { color: #eaeaea; }
    .sub { color: #8892a4; margin-bottom: 3rem; font-size: 1rem; }
    .btn {
      display: block; width: 100%; max-width: 320px;
      padding: 1.1rem; border-radius: 14px; border: none;
      font-family: 'Nunito', sans-serif; font-size: 1.15rem; font-weight: 800;
      cursor: pointer; text-decoration: none; text-align: center;
      margin-bottom: 1rem; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-teacher { background: #e94560; color: white; }
    .btn-student { background: #0f3460; color: #eaeaea; border: 2px solid #3498db; }
  </style>
</head>
<body>
  <div class="logo">Kvíz<span>App</span></div>
  <div class="sub">Interaktivní kvízy pro třídu</div>
  <a class="btn btn-teacher" href="ucitel.html">👩‍🏫 Jsem učitel</a>
  <a class="btn btn-student" href="zak.html">🎮 Jsem žák</a>
</body>
</html>
